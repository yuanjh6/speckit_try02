openapi: 3.0.0
info:
  title: 项目管理API
  description: 管理项目管理平台中的项目
  version: 1.0.0

paths:
  /api/projects:
    get:
      summary: 获取所有项目
      description: 返回系统中所有项目的列表
      responses:
        '200':
          description: 成功返回项目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '500':
          description: 服务器内部错误
    post:
      summary: 创建新项目
      description: 创建一个新项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 项目创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: 请求参数错误
        '500':
          description: 服务器内部错误

  /api/projects/{projectId}:
    get:
      summary: 获取指定项目
      description: 根据项目ID返回项目信息
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功返回项目信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: 项目未找到
        '500':
          description: 服务器内部错误
    put:
      summary: 更新项目
      description: 更新指定项目的信息
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 项目更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: 请求参数错误
        '404':
          description: 项目未找到
        '500':
          description: 服务器内部错误
    delete:
      summary: 删除项目
      description: 删除指定项目
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 项目删除成功
        '404':
          description: 项目未找到
        '500':
          description: 服务器内部错误

components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
          description: 项目唯一标识符
        name:
          type: string
          description: 项目名称
        description:
          type: string
          description: 项目描述
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间
      required:
        - id
        - name
        - createdAt
        - updatedAt

    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          description: 项目名称
        description:
          type: string
          description: 项目描述
      required:
        - name

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          description: 项目名称
        description:
          type: string
          description: 项目描述