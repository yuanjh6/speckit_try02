openapi: 3.0.0
info:
  title: 用户管理API
  description: 管理项目管理平台中的用户
  version: 1.0.0

paths:
  /api/users:
    get:
      summary: 获取所有用户
      description: 返回系统中所有预定义的用户列表
      responses:
        '200':
          description: 成功返回用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: 服务器内部错误

  /api/users/{userId}:
    get:
      summary: 获取指定用户
      description: 根据用户ID返回用户信息
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功返回用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: 用户未找到
        '500':
          description: 服务器内部错误

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: 用户唯一标识符
        name:
          type: string
          description: 用户姓名
        role:
          type: string
          enum: [PRODUCT_MANAGER, ENGINEER]
          description: 用户角色
        createdAt:
          type: string
          format: date-time
          description: 创建时间
      required:
        - id
        - name
        - role
        - createdAt